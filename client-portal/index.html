---
layout: none
---
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Client Login — Bharat Oil Carrier</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>body{font-family:Inter,system-ui;}</style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">

  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="max-w-3xl w-full grid md:grid-cols-2 gap-6">
      <!-- Login -->
      <div class="p-6 bg-white rounded shadow dark:bg-gray-800">
        <h2 class="text-lg font-semibold mb-3">Client Login</h2>
        <form id="loginForm" class="space-y-3">
          <input name="email" type="email" required placeholder="Email" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-700"/>
          <input name="password" type="password" required placeholder="Password" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-700"/>
          <div id="loginMessage" class="text-sm text-red-500"></div>
          <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded">Login</button>
        </form>
      </div>

      <!-- Signup -->
      <div class="p-6 bg-white rounded shadow dark:bg-gray-800">
        <h2 class="text-lg font-semibold mb-3">New Client? Signup</h2>
        <form id="signupForm" class="space-y-3">
          <input name="email" type="email" required placeholder="Email" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-700"/>
          <input name="password" type="password" required placeholder="Password (min 6 char)" class="w-full p-2 border rounded bg-gray-50 dark:bg-gray-700"/>
          <div id="signupMessage" class="text-sm text-green-600"></div>
          <button type="submit" class="w-full px-4 py-2 bg-green-600 text-white rounded">Signup</button>
        </form>

        <p class="mt-4 text-xs text-gray-500">After signup, you can login and view your orders & invoices.</p>
      </div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
